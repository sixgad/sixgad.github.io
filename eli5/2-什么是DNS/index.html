    <a class="back-link" href="../../index-eli5.html">← 返回小白图解</a>
    <div class="wrap">
      <h1>什么是 DNS？</h1>
      <p class="sub">你想给朋友打电话，可你只记得他的名字，不记得号码——怎么办？</p>

      <section class="step">
        <h2>1. 域名是名字，IP 是电话号码</h2>
        <p>每台联网的电脑都有一串号码（IP 地址，比如 1.2.3.4）。但人类记不住号码，只记得住名字（域名，比如 baidu.com）。</p>
        <div class="pic">
          <svg viewBox="0 0 520 130" role="img" aria-label="名字卡片与号码卡片">
            <g stroke="#16130f" stroke-width="2.5" fill="none">
              <rect x="40" y="30" width="200" height="70" rx="8" fill="#fffdf8" />
              <rect x="280" y="30" width="200" height="70" rx="8" fill="#fffdf8" />
            </g>
            <text x="140" y="60" text-anchor="middle" font-size="16" fill="#16130f" font-weight="600">baidu.com</text>
            <text x="140" y="85" text-anchor="middle" font-size="13" fill="#5f5a54">域名（名字）</text>
            <text x="380" y="60" text-anchor="middle" font-size="16" fill="#16130f" font-weight="600">110.242.68.66</text>
            <text x="380" y="85" text-anchor="middle" font-size="13" fill="#5f5a54">IP（号码）</text>
            <g stroke="#2a7d8f" stroke-width="2.5" fill="none">
              <path d="M 245 62 h 28" stroke-dasharray="6 6" />
              <path d="M 268 55 l 14 7 l -14 7 z" fill="#2a7d8f" stroke="none" />
            </g>
          </svg>
          <span class="cap">同一个网站的两种写法</span>
        </div>
      </section>

      <section class="step">
        <h2>2. DNS 是全世界的通讯录</h2>
        <p>DNS（域名系统）就是一本超级通讯录：左边写名字，右边写号码。谁忘了号码，就去翻它。</p>
        <div class="pic">
          <svg viewBox="0 0 520 190" role="img" aria-label="一本翻开的通讯录">
            <g stroke="#16130f" stroke-width="2.5" fill="none">
              <path d="M 60 30 h 190 q 10 0 10 10 v 120 q 0 -10 -10 -10 h -190 z" fill="#fffdf8" transform="rotate(-2 130 90)" />
              <path d="M 460 30 h -190 q -10 0 -10 10 v 120 q 0 -10 10 -10 h 190 z" fill="#f7f2ea" transform="rotate(2 390 90)" />
            </g>
            <g stroke="#5f5a54" stroke-width="2" fill="none">
              <line x1="95" y1="65" x2="225" y2="65" />
              <line x1="95" y1="95" x2="225" y2="95" />
              <line x1="95" y1="125" x2="225" y2="125" />
            </g>
            <text x="95" y="58" font-size="12" fill="#16130f">baidu.com</text>
            <text x="180" y="58" font-size="12" fill="#2a7d8f">110.242...66</text>
            <text x="95" y="88" font-size="12" fill="#16130f">qq.com</text>
            <text x="180" y="88" font-size="12" fill="#2a7d8f">183.36...32</text>
            <text x="95" y="118" font-size="12" fill="#16130f">paker.net.cn</text>
            <text x="180" y="118" font-size="12" fill="#2a7d8f">?.?.?.?</text>
            <text x="300" y="60" font-size="15" fill="#16130f" font-weight="600">DNS 通讯录</text>
            <text x="300" y="90" font-size="13" fill="#5f5a54">名字 → 号码</text>
          </svg>
          <span class="cap">查名字，得号码</span>
        </div>
      </section>

      <section class="step">
        <h2>3. 查号码只要一眨眼</h2>
        <p>你在地址栏输入名字，浏览器立刻去问 DNS。DNS 报出号码，浏览器拿着号码去敲网站的门——网页就打开了。</p>
        <div class="pic">
          <svg viewBox="0 0 520 170" role="img" aria-label="浏览器到DNS再到服务器的流程">
            <g stroke="#16130f" stroke-width="2.5" fill="none">
              <rect x="30" y="55" width="90" height="60" rx="10" fill="#fffdf8" />
              <rect x="215" y="55" width="90" height="60" rx="10" fill="#f7f2ea" />
              <rect x="400" y="55" width="90" height="60" rx="10" fill="#fffdf8" />
            </g>
            <text x="75" y="80" text-anchor="middle" font-size="13" fill="#16130f">浏览器</text>
            <text x="75" y="100" text-anchor="middle" font-size="12" fill="#5f5a54">「baidu.com</text>
            <text x="75" y="115" text-anchor="middle" font-size="12" fill="#5f5a54">是几号？」</text>
            <text x="260" y="80" text-anchor="middle" font-size="13" fill="#16130f">DNS</text>
            <text x="260" y="100" text-anchor="middle" font-size="12" fill="#2a7d8f">「110.242.68.66」</text>
            <text x="445" y="80" text-anchor="middle" font-size="13" fill="#16130f">服务器</text>
            <text x="445" y="100" text-anchor="middle" font-size="12" fill="#5f5a54">「咚咚咚」</text>
            <g stroke="#2a7d8f" stroke-width="2.5" fill="none">
              <path d="M 125 75 h 80" stroke-dasharray="6 7" />
              <path d="M 195 68 l 14 7 l -14 7 z" fill="#2a7d8f" stroke="none" />
              <path d="M 315 95 h 80" stroke-dasharray="6 7" />
              <path d="M 385 88 l 14 7 l -14 7 z" fill="#2a7d8f" stroke="none" />
            </g>
            <text x="160" y="135" font-size="11" fill="#5f5a54">①问号码</text>
            <text x="345" y="135" font-size="11" fill="#5f5a54">②拿号码敲门</text>
          </svg>
          <span class="cap">一眨眼的功夫，网页打开</span>
        </div>
      </section>
