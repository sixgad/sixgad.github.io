<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACG 推荐 · 爬客</title>
    <meta name="description" content="动漫、音乐、小说推荐" />
    <meta name="author" content="zp" />
    <link rel="shortcut icon" href="./static/images/favicon/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="./static/css/plugin.css" />
    <link href="./static/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="./static/css/style.css" />
    <link rel="stylesheet" href="./static/css/ft.css" />
    <link rel="stylesheet" type="text/css" href="./static/css/site-v2.css" />
  </head>
  <body class="site-v2 site-tool site-acg">
    <header class="site-topbar site-topbar--entry" role="banner">
      {% include 'frag_nav.html' %}
    </header>

    <div class="site-tool-wrap site-tool-wrap--wide">
      <div class="site-tool-hero">
        <h1>娱乐推荐</h1>
        <p>主观清单：番剧、音乐与读物，随手记。</p>
      </div>

      <div class="acg-grid" role="list">
        {% for i in acg %}
        <article class="acg-card" data-acg-type="{{ i.type }}" role="listitem">
          <div class="acg-card__meta">
            <span class="acg-card__id" aria-hidden="true">#{{ i.id }}</span>
            <span class="acg-card__type">{{ i.type }}</span>
          </div>
          <h2 class="acg-card__title">{{ i.title }}</h2>
          <p class="acg-card__desc">{{ i.description }}</p>
        </article>
        {% endfor %}
      </div>
    </div>

    <script type="text/javascript" src="./static/js/jquery.min.js"></script>
    <script type="text/javascript" src="./static/js/plugin.js"></script>
  </body>
</html>
