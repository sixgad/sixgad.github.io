<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="description"
      content="爬客 — 导航：博客、文章索引、ACG 推荐与外链。"
    />
    <meta name="author" content="zp" />
    <title>爬客 · 站点导航</title>
    <link rel="shortcut icon" href="./static/images/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      type="image/x-icon"
      href="./static/images/favicon/apple-touch-icon.png"
    />
    <link rel="stylesheet" type="text/css" href="./static/css/plugin.css" />
    <link rel="stylesheet" type="text/css" href="./static/css/style.css" />
    <link rel="stylesheet" href="./static/css/ft.css" />
    <link rel="stylesheet" type="text/css" href="./static/css/site-v2.css" />
  </head>

  <body class="site-v2 site-hub">
    <div class="preloader">
      <div class="rounder"></div>
    </div>

    <header class="site-topbar site-topbar--entry" role="banner">
      {% include 'frag_nav.html' %}
    </header>

    <main class="hub-wrap" id="main">
      <div class="hub-hero">
        <p class="hub-hero__kicker">Paker</p>
        <h1>学习与折腾的存档处</h1>
        <p>
          从这里去首页读最新文章、查全文索引、看 ACG 推荐，或跳转到 GitHub。
        </p>
      </div>

      <div class="hub-grid hub-grid--five">
        <a class="hub-card" href="{{ nav_prefix }}/index.html">
          <div class="hub-card__icon"><i class="fa fa-home"></i></div>
          <h2>博客首页</h2>
          <p>按时间分页浏览文章，适合日常阅读。</p>
          <span class="hub-card__go">进入首页 →</span>
        </a>

        <a class="hub-card" href="{{ nav_prefix }}/index-list.html">
          <div class="hub-card__icon"><i class="fa fa-list"></i></div>
          <h2>文章索引</h2>
          <p>表格视图，按序号快速定位全部公开文章。</p>
          <span class="hub-card__go">打开索引 →</span>
        </a>

        <a class="hub-card" href="{{ nav_prefix }}/index-acg.html">
          <div class="hub-card__icon"><i class="fa fa-music"></i></div>
          <h2>ACG 推荐</h2>
          <p>动漫、音乐、小说等主观安利清单。</p>
          <span class="hub-card__go">查看推荐 →</span>
        </a>

        <a
          class="hub-card"
          href="https://github.com/sixgad"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="hub-card__icon"><i class="fa fa-github"></i></div>
          <h2>GitHub</h2>
          <p>代码与实验仓库，在新标签页打开。</p>
          <span class="hub-card__go">访问 @sixgad →</span>
        </a>

        <a class="hub-card" href="mailto:278270230@qq.com">
          <div class="hub-card__icon"><i class="fa fa-envelope"></i></div>
          <h2>联系邮箱</h2>
          <p>合作、交流或勘误，欢迎邮件联系。</p>
          <span class="hub-card__go">写邮件 →</span>
        </a>
      </div>

      <p class="hub-footnote">辽ICP备2021000509号-1 · 爬客</p>
    </main>

    <a href="#" class="scroll-to-top"><i class="fa fa-long-arrow-up"></i></a>

    <script type="text/javascript" src="./static/js/jquery.min.js"></script>
    <script type="text/javascript" src="./static/js/plugin.js"></script>
    <script type="text/javascript" src="./static/js/scripts.js"></script>
  </body>
</html>
